[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildcostiq"
version = "0.3.0rc1"
description = "AI-native construction cost governance foundation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*", "adapters*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
